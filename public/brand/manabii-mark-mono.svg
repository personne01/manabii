<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="6.4 3 27.2 34"
  width="27"
  height="34"
  role="img"
  aria-label="Manabii"
>
  <!--
    Manabii brand mark.

    An original origami sprout: a tapered stem carrying two mirrored leaves,
    each folded into a lit and a shaded facet, rooted in a folded seed that
    hints at the page of a book. Built from straight edges so the fold reads
    as origami rather than as a smooth gradient.

    Geometry is generated by mark.mjs. The right leaf is the mirrored left
    leaf, and every stem and base coordinate is symmetric about x=20, so the
    mark cannot drift out of balance when it is edited.

    The viewBox is fitted to the artwork rather than to a fixed square, because
    icon assets are never cropped: padding would cost glyph size at 16px.

    Single-colour variant: every facet is solid, so the mark stays legible at favicon sizes.
  -->
  <g stroke="none">
    <!-- stem -->
    <path fill="#D94A38" d="M19.45 21L20.55 21L21.25 35.4L18.75 35.4Z" />
    <!-- base, lit half -->
    <path fill="#D94A38" d="M20 30.4L26.2 35.4L20 35.4Z" />
    <!-- base, shaded half -->
    <path fill="#D94A38" d="M20 30.4L20 35.4L13.8 35.4Z" />
    <!-- left leaf, upper facet -->
    <path fill="#D94A38" d="M20 21L8 4.6L10.1 10.5Z" />
    <!-- left leaf, lower facet -->
    <path fill="#D94A38" d="M20 21L10.1 10.5L12.2 16.4Z" />
    <!-- right leaf, upper facet -->
    <path fill="#D94A38" d="M20 21L32 4.6L29.9 10.5Z" />
    <!-- right leaf, lower facet -->
    <path fill="#D94A38" d="M20 21L29.9 10.5L27.8 16.4Z" />
  </g>
</svg>
